site_name: 私人百科图鉴
site_description: 一套按领域分类的私人百科图鉴
site_url: https://littlesharkw.github.io/private-encyclopedias/
repo_url: https://github.com/littlesharkw/private-encyclopedias
copyright: 内容以 CC BY-NC 4.0 授权

theme:
  name: material
  language: zh
  font: false                  # 字体改由 extra.css 载入
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.tabs          # 领域作为顶部标签页
    - navigation.sections
    - navigation.indexes
    - navigation.top           # 返回顶部按钮
    - navigation.footer        # 上一页／下一页
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

extra_css:
  - fonts/douyin-sans/fonts.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/shelf.js

plugins:
  - search:
      # 配合 requirements.txt 中的 jieba，让中文搜索支持分词
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore

nav:
  - 首页:
    - index.md
    - PDF 图书馆: library.md
    - 标签索引: tags.md
  - 🌿 自然:
    - 花的观察图鉴: nature/flowers/index.md
  - 🫀 身体:
    - 睡眠图鉴: body/sleep/index.md
  - 🧠 心灵:
    - 心理学图鉴: mind/psychology/index.md
  - ✈️ 世界:
    - world/index.md
    - 亚洲:
